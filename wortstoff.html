<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortstoff 32 – Chemie-Beat mit fest eingebauter Wortliste</title>
<style>
  :root {
    --ink: #1E3A4C; --grey: #7A8B94; --line: #C9D4D9;
    --paper: #FAFBF8; --grid: #E4ECEF; --bad: #B5533C; --good: #2E7D6B;
    --card: #FFFFFF;
  }
  body[data-theme="tafel"] {
    --ink: #E8EDE9; --grey: #9DB0A6; --line: #3D5248;
    --paper: #24332C; --grid: #2C3F36; --bad: #E08A76; --good: #7FC9A6;
    --card: #2E4038;
  }
  body[data-theme="poster"] {
    --ink: #4A3728; --grey: #97826E; --line: #D8C6AE;
    --paper: #F6EEDF; --grid: #EDE0C8; --bad: #B5533C; --good: #5F7D4F;
    --card: #FBF6EA;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; color: var(--ink); margin: 0;
    min-height: 100vh; padding: 16px; background: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; max-width: 720px; margin: 0 auto 14px;
    box-shadow: 0 3px 14px rgba(30,58,76,.10), 0 1px 3px rgba(30,58,76,.06); }
  h1 { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 3px;
    margin: 0; font-size: 27px;
    background: linear-gradient(120deg, var(--ink) 55%, var(--good));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 13px; color: var(--grey); margin-top: 2px; }
  button { padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 15px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
  button:hover:not(:disabled) { transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(30,58,76,.15); }
  button:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
  button.primary { background: linear-gradient(135deg, var(--ink), var(--good));
    color: var(--paper); border: none; }
  button.answer { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  button.answer:hover:not(:disabled) { background: var(--grid); }
  button.answer.correct { background: var(--good); color: #fff; border-color: var(--good); }
  button.answer.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  input[type=text] { padding: 10px 12px; font-size: 16px; border: 1.5px solid var(--line);
    border-radius: 8px; font-family: ui-monospace, monospace; width: 100%;
    background: var(--card); color: var(--ink); }
  .avatare { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .avatar { width: 64px; padding: 6px 2px; border: 1.5px solid var(--line); border-radius: 8px;
    text-align: center; cursor: pointer; user-select: none; background: var(--card); }
  .avatar.gewaehlt { box-shadow: 0 0 0 2px var(--ink); transform: translateY(-2px); }
  .avatar.vergeben { opacity: .35; cursor: default; }
  .avatar .kreis { width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 4px;
    display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .avatar .an { font-size: 9px; line-height: 1.15; color: var(--grey); }
  .chip { display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; font-size: 11px; margin-right: 4px;
    vertical-align: -5px; }
  .row { display: flex; gap: 8px; }
  .modal-hintergrund { position: fixed; inset: 0; background: rgba(20,30,26,.55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 14px; }
  .modal { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    max-width: 440px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .modal .kopf { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .modal .zu { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--grey); padding: 2px 8px; }
  .tiles { display: flex; gap: 6px; flex-wrap: wrap; }
  .tile { width: 68px; height: 80px; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 9px; display: flex; flex-direction: column; padding: 3px 5px;
    user-select: none; flex-shrink: 0; box-shadow: 0 2px 5px rgba(30,58,76,.14);
    transition: transform .12s, box-shadow .12s; }
  .tile.clickable { cursor: pointer; }
  .tile.clickable:hover { transform: translateY(-3px) scale(1.04);
    box-shadow: 0 6px 14px rgba(30,58,76,.22); }
  .tile.selected { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--ink); }
  .tile.small { width: 52px; height: 60px; opacity: .85; }
  .tile.kauf { border-style: dashed; border-color: var(--bad); background: #FBF3F1; }
  .tile.big { width: 92px; height: 108px; margin: 0 auto; }
  .tile .top { display: flex; justify-content: space-between; font-size: 9px;
    color: var(--grey); font-family: ui-monospace, monospace; }
  .tile .sym { font-size: 25px; font-weight: 800; text-align: center; flex: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; letter-spacing: -.5px; }
  .tile.small .sym { font-size: 19px; }
  .tile.big .sym { font-size: 34px; }
  .tile .name { font-size: 8px; text-align: center; color: var(--grey);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.big .name { font-size: 10px; }
  .hint { font-size: 12px; color: var(--grey); margin-top: 6px; }
  .err { color: var(--bad); font-size: 14px; }
  .log div { font-size: 13px; padding: 3px 0; font-family: ui-monospace, monospace; }
  .scorebar { font-size: 13px; font-family: ui-monospace, monospace; }
  .scorebar b { text-decoration: underline; }
  .center { text-align: center; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block;
    vertical-align: -2px; margin-right: 4px; }
  #arena { position: relative; height: 320px; border: 1.5px dashed var(--line);
    border-radius: 10px; overflow: hidden; background: rgba(250,251,248,.6); }
  .bubble { position: absolute; animation: pop .25s ease-out; cursor: pointer; }
  .bubble.weg { animation: schwund .3s ease-in forwards; pointer-events: none; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes schwund { to { transform: scale(.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .bubble.weg { animation: none; }
    .card, .pokal, .siegring, .siegbalken { animation: none !important; }
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  .card { animation: fadeUp .25s ease-out; }
  @keyframes pokalWackeln { 0%,100% { transform: scale(1) rotate(-4deg); }
    50% { transform: scale(1.15) rotate(4deg); } }
  .pokal { font-size: 64px; animation: pokalWackeln 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(200,150,20,.45)); }
  @keyframes ringPuls { 0% { box-shadow: 0 0 0 0 var(--sf); }
    100% { box-shadow: 0 0 0 22px transparent; } }
  .siegring { border-radius: 50%; display: inline-flex; animation: ringPuls 1.4s ease-out infinite; }
  @keyframes balkenWachsen { from { width: 0 !important; } }
  .siegbalken { animation: balkenWachsen 1.1s ease-out; }


  /* ---------- Version 30: moderner Schueler-Look ---------- */
  :root {
    --accent: #15A3B8; --accent2: #6C63FF; --sun: #FFB703;
    --soft: rgba(21,163,184,.10); --shadow: 0 14px 38px rgba(30,58,76,.13);
  }
  body[data-theme="tafel"] {
    --accent:#55D6BE; --accent2:#B8A1FF; --sun:#FFD166;
    --soft:rgba(85,214,190,.12); --shadow:0 16px 42px rgba(0,0,0,.28);
  }
  body[data-theme="poster"] {
    --accent:#C45D38; --accent2:#8B5E3C; --sun:#D99A25;
    --soft:rgba(196,93,56,.10); --shadow:0 14px 38px rgba(74,55,40,.15);
  }
  html { scroll-behavior:smooth; }
  body {
    padding:24px 14px 48px;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(21,163,184,.13), transparent 26%),
      radial-gradient(circle at 88% 18%, rgba(108,99,255,.12), transparent 25%),
      radial-gradient(circle at 50% 95%, rgba(255,183,3,.10), transparent 30%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:auto,auto,auto,24px 24px,24px 24px;
    overflow-x:hidden;
  }
  body::before, body::after {
    position:fixed; z-index:-1; font-family:ui-monospace,monospace; font-weight:900;
    color:var(--accent); opacity:.07; pointer-events:none; transform:rotate(-12deg);
  }
  body::before { content:"H   He   C   O   Na   Cl"; top:8%; left:-28px; font-size:42px; }
  body::after { content:"Fe   Cu   Au   U"; right:-25px; bottom:8%; font-size:46px; transform:rotate(10deg); }
  #app { width:min(100%, 960px); margin:0 auto; }
  .card {
    max-width:920px; padding:20px; border-radius:22px; border:1px solid color-mix(in srgb, var(--line) 78%, transparent);
    box-shadow:var(--shadow); backdrop-filter:blur(10px); position:relative; overflow:hidden;
  }
  .card::after {
    content:""; position:absolute; inset:0 0 auto 0; height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--sun)); opacity:.85;
  }
  h1 { font-size:clamp(29px,6vw,48px); letter-spacing:4px; }
  .brand-hero { display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; margin-bottom:16px; }
  .brand-atom {
    width:92px; height:92px; border-radius:28px; display:grid; place-items:center; font-size:52px;
    background:linear-gradient(145deg,var(--accent),var(--accent2)); color:white;
    box-shadow:0 12px 28px rgba(21,163,184,.25); transform:rotate(-5deg);
    animation:atomSchweben 3.2s ease-in-out infinite;
  }
  @keyframes atomSchweben { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-6px) rotate(4deg)} }
  .hero-badges { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  .hero-badge { padding:5px 10px; border-radius:999px; background:var(--soft); border:1px solid var(--line); font-size:12px; font-weight:750; }
  .spielidee { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:15px 0 18px; }
  .idee { padding:11px; border-radius:15px; background:var(--soft); border:1px solid var(--line); font-size:12px; line-height:1.35; }
  .idee b { display:block; font-size:13px; margin-bottom:3px; }
  .section-title { display:flex; align-items:center; gap:8px; font-weight:850; margin:19px 0 8px; font-size:15px; }
  .section-title::before { content:""; width:9px; height:24px; border-radius:7px; background:linear-gradient(var(--accent),var(--accent2)); }
  button { border-radius:13px; padding:11px 18px; box-shadow:0 3px 0 rgba(30,58,76,.08); }
  button.primary { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; box-shadow:0 8px 18px rgba(21,163,184,.23); }
  button.primary:hover:not(:disabled) { box-shadow:0 11px 24px rgba(21,163,184,.30); }
  input[type=text] { border-radius:13px; padding:12px 14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.5); }
  .player-panel { margin-bottom:12px; padding:13px; border:1.5px solid var(--line); border-radius:17px; background:linear-gradient(145deg,var(--card),var(--soft)); }
  .avatar { width:78px; padding:8px 4px; border-radius:14px; transition:transform .16s, box-shadow .16s, opacity .16s; }
  .avatar:hover:not(.vergeben) { transform:translateY(-4px) rotate(-1deg); box-shadow:0 8px 16px rgba(30,58,76,.14); }
  .avatar.gewaehlt { box-shadow:0 0 0 3px var(--accent),0 8px 18px rgba(21,163,184,.18); transform:translateY(-3px); }
  .avatar .an { font-size:10px; }
  .tile {
    border-radius:13px; background:linear-gradient(155deg,#fff 0%,var(--card) 57%,var(--soft) 100%);
    box-shadow:0 6px 12px rgba(30,58,76,.13); overflow:visible;
  }
  body[data-theme="tafel"] .tile { background:linear-gradient(155deg,#354a40,var(--card)); }
  .tile .sym { text-shadow:0 2px 0 rgba(255,255,255,.5); }
  body[data-theme="tafel"] .tile .sym { text-shadow:0 2px 0 rgba(0,0,0,.22); }
  .tile.selected { box-shadow:0 0 0 3px var(--sun),0 9px 22px rgba(255,183,3,.24); transform:translateY(-5px) rotate(-1deg); }
  .game-header { background:linear-gradient(135deg,var(--card),var(--soft)); }
  .hand-card { background:linear-gradient(150deg,var(--card),color-mix(in srgb,var(--soft) 65%,var(--card))); }
  .speech {
    margin:12px auto; max-width:620px; padding:12px 15px; border-radius:16px;
    background:var(--soft); border:1.5px solid var(--accent); font-weight:750; line-height:1.4; position:relative;
  }
  .speech::before { content:""; position:absolute; left:28px; top:-8px; width:14px; height:14px; background:var(--soft); border-left:1.5px solid var(--accent); border-top:1.5px solid var(--accent); transform:rotate(45deg); }
  .speech.good { border-color:var(--good); background:color-mix(in srgb,var(--good) 10%,var(--card)); }
  .speech.good::before { border-color:var(--good); background:color-mix(in srgb,var(--good) 10%,var(--card)); }
  .speech.bad { border-color:var(--bad); background:color-mix(in srgb,var(--bad) 10%,var(--card)); }
  .speech.bad::before { border-color:var(--bad); background:color-mix(in srgb,var(--bad) 10%,var(--card)); }
  .quiz-card { padding-top:25px; }
  .quiz-icon { width:88px; height:88px; margin:15px auto; border-radius:28px; display:grid; place-items:center; font-size:52px; background:linear-gradient(145deg,var(--soft),var(--card)); border:1.5px solid var(--line); box-shadow:0 10px 24px rgba(30,58,76,.12); }
  button.answer { padding:13px 15px; border-radius:14px; position:relative; }
  button.answer::before { content:attr(data-letter); display:inline-grid; place-items:center; width:25px; height:25px; margin-right:9px; border-radius:8px; background:var(--grid); font-size:12px; }
  button.answer.correct::before, button.answer.wrong::before { background:rgba(255,255,255,.22); }
  .handoff-card { margin-top:70px; background:linear-gradient(145deg,var(--card),var(--soft)); }
  .handoff-note { margin:12px auto 18px; max-width:520px; padding:10px 14px; border-radius:15px; border:1px dashed var(--accent); background:var(--soft); font-size:14px; }
  .scorebar { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .status-strip { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .status-chip { padding:5px 9px; border-radius:999px; background:var(--soft); border:1px solid var(--line); font-size:11px; font-weight:750; }
  #arena { height:350px; border-radius:18px; border:2px dashed var(--accent); background:
    radial-gradient(circle at 20% 30%,rgba(21,163,184,.10),transparent 25%),
    radial-gradient(circle at 80% 70%,rgba(108,99,255,.10),transparent 25%),var(--card); }
  .bubble { filter:drop-shadow(0 7px 6px rgba(30,58,76,.18)); }
  .message-box { padding:10px 13px; border-radius:13px; background:color-mix(in srgb,var(--bad) 9%,var(--card)); border:1px solid var(--bad); color:var(--bad); font-size:13px; font-weight:700; margin-bottom:8px; }
  .victory-quote { margin:8px auto 16px; max-width:520px; padding:11px 15px; border-radius:16px; background:var(--soft); border:1px solid var(--line); font-weight:800; }
  @media (max-width:700px) {
    .spielidee { grid-template-columns:1fr 1fr; }
    .brand-hero { grid-template-columns:1fr; text-align:center; }
    .brand-atom { margin:auto; width:78px; height:78px; font-size:44px; }
    .hero-badges { justify-content:center; }
    .avatar { width:70px; }
    .card { padding:16px; border-radius:18px; }
  }
  @media (max-width:430px) {
    body { padding:10px 7px 28px; }
    .spielidee { grid-template-columns:1fr; }
    .row { flex-wrap:wrap; }
    .row > button { min-width:calc(50% - 4px); }
    .tile { width:62px; height:75px; }
  }



  /* ---------- Version 34: Schülerwortschatz und ausschließlich Alltagschemie-Fragen ---------- */
  .risk-panel {
    max-width:560px; margin:0 auto 14px; padding:13px 15px; border-radius:18px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 15%,var(--card)),var(--soft));
    border:1.5px solid color-mix(in srgb,var(--sun) 65%,var(--line)); text-align:left;
    box-shadow:0 8px 22px rgba(30,58,76,.10);
  }
  .risk-title { display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:900; }
  .risk-stake { padding:5px 9px; border-radius:999px; background:color-mix(in srgb,var(--bad) 12%,var(--card));
    border:1px solid var(--bad); color:var(--bad); font-size:12px; white-space:nowrap; }
  .difficulty { display:flex; align-items:center; gap:6px; margin-top:9px; color:var(--grey); font-size:12px; }
  .difficulty-dots { display:flex; gap:4px; }
  .difficulty-dot { width:18px; height:7px; border-radius:999px; background:var(--grid); border:1px solid var(--line); }
  .difficulty-dot.on { background:linear-gradient(90deg,var(--accent),var(--accent2)); border-color:transparent; }
  .hint-rule { margin:9px 0 0; font-size:12px; line-height:1.4; color:var(--grey); }
  .hint-rule b:first-child { color:var(--good); }
  .hint-rule b:last-child { color:var(--bad); }
  .hint-button { position:relative; overflow:hidden; }
  .hint-button::after { content:"QUIZ"; position:absolute; right:-17px; top:7px; transform:rotate(38deg);
    padding:2px 20px; background:var(--sun); color:#2b2600; font-size:8px; letter-spacing:1px; font-weight:900; }
  .sound-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:999px;
    background:var(--soft); border:1px solid var(--line); font-size:11px; color:var(--grey); }

</style>

const KONFIG_AUSNAHMEN = {
  Cr:["4s","3d",1], Cu:["4s","3d",1], Nb:["5s","4d",1], Mo:["5s","4d",1],
  Ru:["5s","4d",1], Rh:["5s","4d",1], Pd:["5s","4d",2], Ag:["5s","4d",1],

};

const HOCH = {0:"\u2070",1:"\u00b9",2:"\u00b2",3:"\u00b3",4:"\u2074",
              5:"\u2075",6:"\u2076",7:"\u2077",8:"\u2078",9:"\u2079"};
function hoch(n){ return String(n).split("").map(d=>HOCH[d]).join(""); }

function konfiguration(z, sym){
  const belegung = {};
  let rest = z;
  for (const orb of ORBITALE){
    if (rest<=0) break;
    const kap = KAPAZITAET[orb[orb.length-1]];
    const n = Math.min(kap, rest);
    belegung[orb] = n; rest -= n;
  }
  const aus = KONFIG_AUSNAHMEN[sym];
  if (aus){
    const [von, nach, anz] = aus;
    belegung[von] = (belegung[von]||0) - anz;
    belegung[nach] = (belegung[nach]||0) + anz;
    if (belegung[von]<=0) delete belegung[von];
  }
  return belegung;
}

function konfigText(z, sym){
  const belegung = konfiguration(z, sym);
  // Edelgas-Kurzschreibweise
  let kern = null;
  for (const [gz, gs] of EDELGASE_Z){
    if (z > gz){ kern = [gz, gs]; break; }
  }
  let uebrig = {...belegung};
  if (kern){
    const kernBelegung = konfiguration(kern[0], kern[1]);
    for (const orb in kernBelegung){
      uebrig[orb] -= kernBelegung[orb];
      if (uebrig[orb]<=0) delete uebrig[orb];
    }
  }
  const teile = Object.keys(uebrig)
    .sort((a,b)=> a[0]-b[0] || "spdf".indexOf(a[1])-"spdf".indexOf(b[1]))
    .map(orb => orb + hoch(uebrig[orb]));
  return (kern ? `[${kern[1]}] ` : "") + teile.join(" ");
}

function valenzelektronen(z, sym){
  const belegung = konfiguration(z, sym);
  const maxN = Math.max(...Object.keys(belegung).map(o=>+o[0]));
  let summe = 0;
  for (const orb in belegung) if (+orb[0]===maxN) summe += belegung[orb];
  return summe;
}

function schalen(z){
  const kap = [2,8,8,2];
  const out = [];
  let rest = z;
  for (const k of kap){
    if (rest<=0) break;
    const n = Math.min(k, rest);
    out.push(n); rest -= n;
  }
  return out.join(", ");
}

let audioCtx = null, audioMaster = null;
function audioStart(){
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 18;
      comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .18;
      audioMaster = audioCtx.createGain();
      audioMaster.gain.value = .72;
      audioMaster.connect(comp); comp.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch(e){ return null; }
}
function audioZiel(){ return audioMaster || (audioStart() && audioMaster); }
function ton(freq, wann, dauer, typ, lautstaerke, zielFreq, detune){
  try {
    const ctx = audioStart(), ziel = audioZiel(); if (!ctx || !ziel) return;
    const o = ctx.createOscillator(), filter = ctx.createBiquadFilter(), g = ctx.createGain();
    const t = ctx.currentTime + (wann || 0), d = Math.max(.04, dauer || .15);
    o.type = typ || "sine"; o.detune.value = detune || 0;
    o.frequency.setValueAtTime(Math.max(25,freq), t);
    if (zielFreq) o.frequency.exponentialRampToValueAtTime(Math.max(25,zielFreq), t+d);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(Math.max(750, Math.min(9500, freq*8)), t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(500, Math.min(7000, freq*3)), t+d);
    filter.Q.value = 1.7;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(lautstaerke || .07, t + Math.min(.012,d/4));
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(filter); filter.connect(g); g.connect(ziel);
    o.start(t); o.stop(t+d+.03);
  } catch(e){}
}
function rauschen(wann, dauer, lautstaerke, frequenz, art){
  try {
    const ctx=audioStart(), ziel=audioZiel(); if(!ctx||!ziel) return;
    const d=dauer||.08, len=Math.max(1,Math.floor(ctx.sampleRate*d));
    const buffer=ctx.createBuffer(1,len,ctx.sampleRate), data=buffer.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
    const src=ctx.createBufferSource(), filter=ctx.createBiquadFilter(), g=ctx.createGain();
    const t=ctx.currentTime+(wann||0); src.buffer=buffer;
    filter.type=art||"highpass"; filter.frequency.value=frequenz||2200; filter.Q.value=1.2;
    g.gain.setValueAtTime(lautstaerke||.025,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    src.connect(filter); filter.connect(g); g.connect(ziel); src.start(t); src.stop(t+d+.02);
  } catch(e){}
}
function kick(wann, lautstaerke){

    const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+(wann||0);
    o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+.13);

// Anspornende und humorvolle Kommentare – mit Wiederholungsschutz
const KOMMENTAR_MERKER = {};
function kommentarOhneWiederholung(schluessel, liste, ...args){
  if (!liste.length) return "";
  let idx = Math.floor(Math.random()*liste.length);
  if (liste.length > 1 && KOMMENTAR_MERKER[schluessel] === idx)
    idx = (idx + 1 + Math.floor(Math.random()*(liste.length-1))) % liste.length;
  KOMMENTAR_MERKER[schluessel] = idx;
  const eintrag = liste[idx];
  return typeof eintrag === "function" ? eintrag(...args) : eintrag;
}

let letzteHinweisFrage = "";
function macheHinweisfrage(nummer){
  const grad = Math.min(5, Math.max(1, nummer));
  const basis = ({k78:1,k9:2,ober:3})[state.niveau || "k9"] || 2;
  const maxMin = Math.min(3, basis + (nummer >= 3 ? 1 : 0));
  let pool = HINWEISFRAGEN.filter(q => q.grad === grad && q.min <= maxMin);
  if (!pool.length) pool = HINWEISFRAGEN.filter(q => q.grad === grad);
  let kandidaten = pool.filter(q => q.t !== letzteHinweisFrage);
  if (!kandidaten.length) kandidaten = pool;
  const q = zufall(kandidaten);
  letzteHinweisFrage = q.t;
  const optionen = mischen([q.r, ...q.f]);
  return {
    text:q.t, optionen, richtig:optionen.indexOf(q.r), hinweis:q.h,
    schwierigkeitsgrad:grad, schwierigkeitsname:HINWEIS_SCHWIERIGKEIT[grad]
  };
}

  const maxN = niveau === "k78" ? 1 : niveau === "k9" ? 2 : 3;
  const passend = ALLTAG_ZUSATZFRAGEN.filter(q =>
    q.n <= maxN && Array.isArray(q.s) && q.s.includes(sym)
  );
  const allgemein = ALLTAG_ZUSATZFRAGEN.filter(q => q.n <= maxN && q.s === null);

  // Ist eine passende Anwendung vorhanden, wird sie bevorzugt.
  let pool = passend.length ? passend : allgemein;
  let kandidaten = pool.filter(q => q.t !== letzteAlltagsZusatzfrage);
  if (!kandidaten.length && passend.length) {
    kandidaten = allgemein.filter(q => q.t !== letzteAlltagsZusatzfrage);
  }
  if (!kandidaten.length) kandidaten = pool.length ? pool : allgemein;

  const q = zufall(kandidaten);
  letzteAlltagsZusatzfrage = q.t;
  const optionen = mischen([q.r, ...q.f]);
  return {
    text:q.t,
    optionen,
    richtig:optionen.indexOf(q.r),
    hinweis:q.h,
    alltagschemie:true
  };
}

let letzteAlltagsfrage = "";
function macheAlltagsfrage(){
  const niveau = state.niveau || "k9";
  let pool;
  if (niveau === "k78") pool = ALLTAGSCHEMIE_FRAGEN.k78;
  else if (niveau === "k9") pool = [...ALLTAGSCHEMIE_FRAGEN.k78, ...ALLTAGSCHEMIE_FRAGEN.k9, ...ALLTAGSCHEMIE_FRAGEN.k9];
  else pool = [...ALLTAGSCHEMIE_FRAGEN.k78, ...ALLTAGSCHEMIE_FRAGEN.k9, ...ALLTAGSCHEMIE_FRAGEN.ober, ...ALLTAGSCHEMIE_FRAGEN.ober];
  let kandidaten = pool.filter(q => q.t !== letzteAlltagsfrage);
  if (!kandidaten.length) kandidaten = pool;
  const q = zufall(kandidaten);
  letzteAlltagsfrage = q.t;
  const optionen = mischen([q.r, ...q.f]);
  return { text:q.t, optionen, richtig:optionen.indexOf(q.r), hinweis:q.h };
}

function macheReaktionsfrage(){

// ---------------- Konfetti fuer den Siegbildschirm ----------------
let konfettiRAF = null;
function startKonfetti(){
  try {
    if (typeof requestAnimationFrame === "undefined" || !document.body || !document.body.appendChild) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    stopKonfetti();
    const c = document.createElement("canvas");
    c.id = "konfetti";
    c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:45";
    document.body.appendChild(c);
    const ctx = c.getContext("2d");
    c.width = window.innerWidth; c.height = window.innerHeight;
    const farben = CHEMIKER.map(ch=>ch.farbe).concat(["#E8B84B","#D96A4E","#4E9AD9"]);
    const teile = Array.from({length:140}, ()=>({
      x: Math.random()*c.width, y: -20 - Math.random()*c.height,
      w: 6+Math.random()*7, h: 4+Math.random()*5,
      vy: 1.4+Math.random()*2.4, vx: (Math.random()-0.5)*1.4,
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.16,
      farbe: farben[Math.floor(Math.random()*farben.length)],
    }));
    const start = Date.now();
    (function tick(){
      ctx.clearRect(0,0,c.width,c.height);
      for (const t of teile){
        t.y += t.vy; t.x += t.vx + Math.sin(t.y*0.02)*0.6; t.rot += t.vr;
        if (t.y > c.height + 20){ t.y = -20; t.x = Math.random()*c.width; }
        ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.rot);
        ctx.fillStyle = t.farbe; ctx.fillRect(-t.w/2, -t.h/2, t.w, t.h);
        ctx.restore();
      }
      if (Date.now() - start < 12000 && state.phase === "won")
        konfettiRAF = requestAnimationFrame(tick);
      else stopKonfetti();
    })();
  } catch(e){ /* Feiern ohne Konfetti geht auch */ }
}
function stopKonfetti(){
  try {
    if (konfettiRAF){ cancelAnimationFrame(konfettiRAF); konfettiRAF = null; }
    const alt = document.getElementById("konfetti");
    if (alt && alt.remove) alt.remove();
  } catch(e){}
}

// Elektronen pro Schale (aus der echten Konfiguration)
function schalenBelegung(sym){
  const [,,z] = BY_SYMBOL[sym];
  const belegung = konfiguration(z, sym);
  const s = {};
  for (const orb in belegung){ const n = +orb[0]; s[n] = (s[n]||0) + belegung[orb]; }
  return Object.keys(s).sort((a,b)=>a-b).map(n=>s[n]);
}

// SVG: Bohrsches Atommodell
function zeichneAtom(sym){
  const [,name,z,val] = [BY_SYMBOL[sym][0], BY_SYMBOL[sym][1], BY_SYMBOL[sym][2], BY_SYMBOL[sym][3]];
  const schalenListe = schalenBelegung(sym);
  const c = tierColor(BY_SYMBOL[sym][3]);
  const mitte = 150, maxR = 138;
  let svg = `<svg viewBox="0 0 300 300" style="width:100%;max-width:320px">`;
  svg += `<circle cx="${mitte}" cy="${mitte}" r="22" fill="${c}" opacity="0.9"/>`;
  svg += `<text x="${mitte}" y="${mitte-2}" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="monospace">${sym}</text>`;
  svg += `<text x="${mitte}" y="${mitte+12}" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">${z}p\u207a</text>`;
  const abstand = Math.min(16, (maxR-30)/Math.max(1,schalenListe.length));
  schalenListe.forEach((anzahl, i) => {
    const r = 34 + (i+1)*abstand;
    svg += `<circle cx="${mitte}" cy="${mitte}" r="${r}" fill="none" stroke="${c}" stroke-width="1" opacity="0.45"/>`;
    const punkte = Math.min(anzahl, 18);
    for (let e=0; e<punkte; e++){
      const w = (2*Math.PI*e)/punkte - Math.PI/2;
      svg += `<circle cx="${mitte + r*Math.cos(w)}" cy="${mitte + r*Math.sin(w)}" r="3.2" fill="${c}"/>`;
    }
    svg += `<text x="${mitte + r + 4}" y="${mitte - 3}" font-size="8" fill="${c}" font-family="monospace">${anzahl}e\u207b</text>`;
  });
  svg += `</svg>`;
  return svg;
}

}

// vom Nutzer per Datei geladene Zusatzwoerter
const ZUSATZ = {3:[],4:[],5:[],6:[],7:[],8:[]};

// minimale Symbolanzahl einer Zerlegung (fuer die Stufen-Einordnung)
function minSymbole(w){
  const INF = 1e9, n = w.length;
  const dp = Array(n+1).fill(INF); dp[0]=0;
  for (let i=0;i<n;i++){
    if (dp[i]===INF) continue;
    for (const L of [1,2])
      if (i+L<=n && BY_LOWER[w.slice(i,i+L)]) dp[i+L] = Math.min(dp[i+L], dp[i]+1);
  }
  return dp[n]===INF ? null : dp[n];
}

function ladeWortdatei(input){
  const datei = input.files && input.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    let neu = 0, abgelehnt = 0;
    // vorhandene Woerter normalisiert erfassen (Gross-/Kleinschreibung egal)
    const vorhanden = new Set();
    for (let k=3;k<=8;k++)
      for (const w of [...RUNDENWOERTER[k], ...ZUSATZ[k]]) vorhanden.add(normalize(w));
    const zeilen = String(leser.result).split(/\r?\n/);
    for (let zeilenNr=0; zeilenNr<zeilen.length; zeilenNr++){
      let wort = zeilen[zeilenNr].trim();
      if (!wort || wort.startsWith("#")) continue;
      if (wort.includes(";")){
        const spalten = wort.split(";");
        if (zeilenNr===0 && /^wort$/i.test(spalten[0].trim())) continue;
        wort = spalten[0].trim();
      }
      const norm = normalize(wort);
      const m = minSymbole(norm);
      if (m && m>=3 && m<=8 && !vorhanden.has(norm)){
        ZUSATZ[m].push(wort); vorhanden.add(norm); neu++;
      } else abgelehnt++;
    }
    state.ladeInfo = `${neu} Woerter uebernommen` + (abgelehnt?`, ${abgelehnt} nicht zerlegbar/doppelt/ausserhalb Stufe 3-8`:"") + ` [${datei.name}]`;
    render();
  };
  leser.readAsText(datei);
}

function copiesFor(v){ return v<=1?7 : v===2?5 : v===3?4 : v===4?3 : v<=6?2 : 1; }

function buildDrum(){
  const d = [];
  for (const [sym,,,val] of ELEMENTS)
    for (let i=0;i<copiesFor(val);i++) d.push(sym);
  for (let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

function normalize(word){
  let w = word.trim().toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  return w.replace(/[^a-z]/g,"");
}

function bestDecomposition(word, hand){
  const counts = {};
  for (const s of hand) counts[s]=(counts[s]||0)+1;
  let best=null, bestScore=-1; const path=[];
  (function go(i, score){
    if (i===word.length){ if(score>bestScore){bestScore=score;best=[...path];} return; }
    for (const L of [2,1]){
      if (i+L>word.length) continue;
      const sym = BY_LOWER[word.slice(i,i+L)];
      if (sym && counts[sym]>0){
        counts[sym]--; path.push(sym);
        go(i+L, score+BY_SYMBOL[sym][3]);
        path.pop(); counts[sym]++;
      }
    }
  })(0,0);
  return best ? {symbols:best, score:bestScore} : null;
}

// Zerlegung mit Zukauf: bis zu maxKauf fehlende Symbole duerfen
// gegen Punkte "gekauft" werden (Kosten = Punktwert des Elements)
function bestDecompositionMitKauf(word, hand, maxKauf, budget){
  const counts = {};
  for (const s of hand) counts[s]=(counts[s]||0)+1;
  let best=null, bestNetto=-Infinity;
  const path=[]; // Eintraege: {sym, gekauft}
  (function go(i, score, kosten, kaeufe){
    if (i===word.length){
      const netto = score - kosten;
      if (netto > bestNetto || (netto===bestNetto && best && kaeufe < best.gekauft.length)){
        bestNetto = netto;
        best = { symbols: path.map(p=>p.sym),
                 gekauft: path.filter(p=>p.gekauft).map(p=>p.sym),
                 score, kosten };
      }
      return;
    }
    for (const L of [2,1]){
      if (i+L>word.length) continue;
      const sym = BY_LOWER[word.slice(i,i+L)];
      if (!sym) continue;
      const wert = BY_SYMBOL[sym][3];
      if (counts[sym]>0){
        counts[sym]--; path.push({sym, gekauft:false});
        go(i+L, score+wert, kosten, kaeufe);
        path.pop(); counts[sym]++;
      } else if (kaeufe < maxKauf && kosten + wert <= budget){
        path.push({sym, gekauft:true});
        go(i+L, score+wert, kosten+wert, kaeufe+1);
        path.pop();
      }
    }
  })(0,0,0,0);
  return best;
}

function zufall(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function mischen(arr){
  const a=[...arr];
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function macheFrage(sym, schwer){
  const [symbol,name,z,,kat,zustand] = BY_SYMBOL[sym];
  const istHG = HAUPTGRUPPEN.has(kat);
  const niveau = state.niveau || "k9";

  // verfuegbare Typen nach Lehrplan-Niveau sammeln
  const t78 = ["name","metallart"];
  if (zustand !== "?") t78.push("zustand");
  if (DICHTE[sym] !== undefined) t78.push("dichte");
  if (kat==="EDG" || EDELMETALLE.has(sym)) t78.push("reaktiv");

  const t9 = ["ordnungszahl","kategorie","radioaktiv"];
  if (z <= 20) t9.push("schalen","schalen");
  if (istHG && z <= 86) t9.push("valenz","wertigkeit","hauptgruppe","periode");
  if (ION[sym] !== undefined) t9.push("ion","ion");
  if (VERBINDUNG[sym]) t9.push("verbindung","verbindung");
  if (FLAMME[sym]) t9.push("flamme","flamme");
  if (kat==="ALK" || HALOGEN_RANG[sym]) t9.push("reaktiv");

  const tOber = (z <= 103) ? ["konfig"] : [];

  let typen;
  if (niveau==="k78") typen = [...t78];
  else if (niveau==="k9") typen = [...t78, ...t9];
  else typen = [...t78, ...t9, ...tOber];

  if (schwer){
    const hart = new Set(["schalen","wertigkeit","verbindung","ion","hauptgruppe",
      "flamme","dichte","konfig","reaktiv","periode"]);
    const schwere = typen.filter(t=>hart.has(t));
    if (schwere.length) typen = schwere;
  }
  if (!typen.length) typen = ["name","ordnungszahl"];
  const typ = zufall(typen);

  if (typ==="metallart"){
    const richtig = metallart(kat);
    const optionen = mischen(["Metall","Halbmetall","Nichtmetall"]);
    return { text:`Ist ${name} ein Metall, ein Halbmetall oder ein Nichtmetall?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="schalen"){
    const richtig = schalen(z);
    const falsch = [];
    for (const off of mischen([-2,-1,1,2,3,-3])){
      const nz = z + off;
      if (nz<1 || nz>20) continue;
      const s = schalen(nz);
      if (s!==richtig && !falsch.includes(s)) falsch.push(s);
      if (falsch.length===3) break;
    }
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Wie verteilen sich die Elektronen von ${name} auf die Schalen (K, L, M, \u2026)?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="hauptgruppe"){
    const richtig = hauptgruppeVon(sym);
    const falsch = mischen(ROEMISCH.filter(r=>r!==richtig)).slice(0,3);
    const optionen = mischen([richtig, ...falsch]).map(r=>r+". Hauptgruppe");
    return { text:`In welcher Hauptgruppe des Periodensystems steht ${name}?`,
      optionen, richtig: optionen.indexOf(richtig+". Hauptgruppe") };
  }

  if (typ==="periode"){
    const richtig = periodeVon(z, sym);
    const falsch = mischen([1,2,3,4,5,6,7].filter(p=>p!==richtig)).slice(0,3);
    const optionen = mischen([richtig, ...falsch]);
    return { text:`In welcher Periode des Periodensystems steht ${name}?`,
      optionen: optionen.map(String), richtig: optionen.indexOf(richtig) };
  }

  if (typ==="ion"){
    const ladung = ION[sym];
    const richtig = ionText(sym, ladung);
    const falsch = mischen([1,2,3,-1,-2,-3].filter(l=>l!==ladung)).slice(0,3)
      .map(l=>ionText(sym, l));
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Welches Ion bildet ${name} typischerweise?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="wertigkeit"){
    const richtig = wertigkeit(z, sym);
    const falsch = mischen([0,1,2,3,4].filter(v=>v!==richtig)).slice(0,3);
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Welche Wertigkeit hat ${name} ueblicherweise in Verbindungen (z.B. gegenueber Wasserstoff)?`,
      optionen: optionen.map(String), richtig: optionen.indexOf(richtig) };
  }

  if (typ==="verbindung"){
    const [partner, teile] = VERBINDUNG[sym];
    const richtig = formel(teile);
    const optionen = mischen([richtig, ...formelVarianten(teile)]);
    return { text:`Welche Formel hat die typische Verbindung von ${name} mit ${partner}?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="konfig"){
    const richtig = konfigText(z, sym);
    // Distraktoren: Konfigurationen der Nachbarelemente
    const falsch = [];
    for (const off of mischen([-2,-1,1,2,3,-3])){
      const nz = z + off;
      if (nz<1 || nz>103) continue;
      const nsym = ELEMENTS[nz-1][0];
      const k = konfigText(nz, nsym);
      if (k!==richtig && !falsch.includes(k)) falsch.push(k);
      if (falsch.length===3) break;
    }
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Wie lautet die Elektronenkonfiguration von ${name}?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="valenz"){
    const richtig = valenzelektronen(z, sym);
    const falsch = mischen([1,2,3,4,5,6,7,8].filter(v=>v!==richtig)).slice(0,3);
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Wie viele Valenzelektronen (Aussenelektronen) hat ${name}?`,
      optionen: optionen.map(String), richtig: optionen.indexOf(richtig) };
  }

  if (typ==="flamme"){
    const richtig = FLAMME[sym];
    const falsch = mischen(FLAMMEN_FARBEN.filter(f=>f!==richtig)).slice(0,3);
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Welche Flammenfaerbung zeigt ${name}?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="dichte"){
    const d = DICHTE[sym];
    // Distraktoren: echte Dichten anderer Elemente, deutlich verschieden
    const kandidaten = mischen(Object.values(DICHTE)
      .filter(x => Math.abs(Math.log(x/d)) > 0.45));
    const falsch = [];
    for (const k of kandidaten){
      if (falsch.every(f => Math.abs(Math.log(k/f)) > 0.3)) falsch.push(k);
      if (falsch.length===3) break;
    }
    while (falsch.length<3) falsch.push(d * [0.3,2.5,6][falsch.length]);
    const fmt = x => x.toFixed(x<3?2:1).replace(".",",");
    const optionen = mischen([d, ...falsch]);
    return { text:`Welche Dichte hat ${name} ungefaehr (in g/cm\u00b3)?`,
      optionen: optionen.map(fmt), richtig: optionen.indexOf(d) };
  }

  if (typ==="reaktiv"){
    if (kat==="ALK"){
      const richtig = "Es reagiert heftig, dabei entsteht Wasserstoff";
      const optionen = mischen([richtig,
        "Nichts \u2013 es sinkt einfach zu Boden",
        "Es loest sich langsam ohne Gasbildung",
        "Es reagiert nur mit heissem Wasserdampf"]);
      return { text:`Was passiert, wenn man ${name} in Wasser gibt?`,
        optionen, richtig: optionen.indexOf(richtig) };
    }
    if (kat==="EDG"){
      const richtig = "Praktisch gar nicht \u2013 es geht kaum Verbindungen ein";
      const optionen = mischen([richtig,
        "Es reagiert heftig mit Wasser",
        "Es verbrennt an der Luft",
        "Es reagiert stark mit Metallen"]);
      return { text:`Wie reaktionsfreudig ist das Edelgas ${name}?`,
        optionen, richtig: optionen.indexOf(richtig) };
    }
    if (HALOGEN_RANG[sym]){
      const andere = zufall(Object.keys(HALOGEN_RANG).filter(h=>h!==sym));
      const richtig = HALOGEN_RANG[sym] > HALOGEN_RANG[andere] ? "Ja" : "Nein";
      const optionen = ["Ja","Nein"];
      return { text:`Ist ${name} reaktionsfreudiger als ${BY_SYMBOL[andere][1]}?`,
        optionen, richtig: optionen.indexOf(richtig),
        hinweis:"Bei den Halogenen nimmt die Reaktivitaet von Fluor zu Astat ab." };
    }
    // Edelmetall
    const richtig = `Sehr gering \u2013 ${name} gilt als Edelmetall`;
    const optionen = mischen([richtig,
      "Sehr hoch \u2013 es reagiert schon mit Luftfeuchtigkeit",
      "Es reagiert heftig mit Wasser",
      "Es entzuendet sich von selbst an der Luft"]);
    return { text:`Wie reaktionsfreudig ist ${name}?`,
      optionen, richtig: optionen.indexOf(richtig) };
  }

  if (typ==="kategorie"){
    const richtig = KAT_NAMEN[kat];
    const falsch = mischen(Object.values(KAT_NAMEN).filter(k=>k!==richtig)).slice(0,3);
    const optionen = mischen([richtig, ...falsch]);
    return { text:`Zu welcher Kategorie gehoert ${name}?`,
      optionen, richtig: optionen.indexOf(richtig) };

  if (typ==="zustand"){
    const richtig = ZUSTAND_NAMEN[zustand];
    const optionen = mischen(Object.values(ZUSTAND_NAMEN));

  if (typ==="ordnungszahl"){
    const falsch = new Set();
    while (falsch.size<3){
      const off = (Math.floor(Math.random()*8)+1) * (Math.random()<0.5?-1:1);

    const text = zufall([`Welche Ordnungszahl hat ${name}?`,
      `Wie viele Protonen enthaelt der Atomkern von ${name}?`]);
    return { text, optionen: optionen.map(String), richtig: optionen.indexOf(z), zahlVerdeckt:true };
  }
  if (typ==="name"){
    const falsch = mischen(ELEMENTS.filter(e=>e[0]!==symbol)).slice(0,3).map(e=>e[1]);
    const optionen = mischen([name, ...falsch]);
    return { text:`Wie heisst das Element mit dem Symbol ${symbol}?`,
      optionen, richtig: optionen.indexOf(name), verdeckt:true };
  }
  // radioaktiv
  const richtig = istRadioaktiv(sym) ? "Ja" : "Nein";
  const optionen = ["Ja","Nein"];
  return { text:`Ist ${name} radioaktiv (kein stabiles Isotop)?`,
    optionen, richtig: optionen.indexOf(richtig) };
}

// ---------------- Zustand ----------------
let state = {
  phase: "setup", names: ["Spieler 1","Spieler 2"], target: 75,
  avatare: [0, 1], theme: "papier", niveau: "k9",
  modus: "runden", zugNr: 0, zielwort: null, rundenWoerter: null, rundenSets: null, ladeInfo: "",
  drum: [], hands: [], scores: [], current: 0,
  word: "", swapSel: [], log: [], message: "", winner: null,
  quiz: null, // { sym, frage, gewaehlt, art, kosten?, hinweisNr? }
  draw: null, // { needed, maxPick, picked, swapBack, logEntry }
  doubler: false, // Alltagschemie-Frage richtig -> Wortpunkte x2
  hatGelegt: false, // im Rundenmodus: Zielwort in diesem Zug gelegt?
  hinweise: 0, aufgeloest: false,
  klangAn: true, klangFuer: "", lob: "", bildFenster: null, siegSpruch: "",
  wortWahl: [], steckbrief: null,
  bonus: null, // { symbols, idx, extra, needed, entryBase }
};

// ---------------- Aktionen ----------------
function startGame(){
  const d = buildDrum();
  state.hands = state.names.map(()=>d.splice(0,HAND_SIZE));
  state.drum = d;
  state.scores = state.names.map(()=> state.modus==="runden" ? 10 : 0);
  state.current = 0; state.log = []; state.winner = null; state.siegSpruch = "";
  state.word=""; state.swapSel=[]; state.message=""; state.quiz=null;
  state.wortWahl=[]; state.steckbrief=null;
  state.zugNr = 0; state.zielwort = null;
  state.rundenWoerter = {};
  state.rundenSets = {};
  state.rundenGewichtet = {};
  for (let k=3;k<=8;k++){
    state.rundenWoerter[k] = [...RUNDENWOERTER[k], ...ZUSATZ[k]];
    state.rundenSets[k] = new Set(state.rundenWoerter[k].map(normalize));
    // eigene Woerter doppelt im Lostopf -> doppelte Ziehungschance
    state.rundenGewichtet[k] = [...RUNDENWOERTER[k], ...ZUSATZ[k], ...ZUSATZ[k]];
  }
  state.naechstesZiel = state.names.map(()=>({ wort: zufall(state.rundenGewichtet[3]), stufe: 3 }));
  state.phase = "handoff"; render();
}

function nextPlayer(entry){
  if (entry) state.log = [entry, ...state.log].slice(0,12);
  const w = state.scores.findIndex(s=>s>=state.target);
  if (w>=0){ state.winner=w; state.siegSpruch=siegText(state.names[w]); state.phase="won"; render(); klangSieg(); startKonfetti(); return; }
  const vorheriger = state.current;
  state.zugNr++;
  if (state.modus==="runden" && state.rundenWoerter && state.hatGelegt){
    // neues Zielwort erst, wenn das alte gelegt wurde
    const naechsteZugNr = state.zugNr + state.names.length - 1;
    const stufe = stufeFuer(naechsteZugNr);
    state.naechstesZiel[vorheriger] = { wort: zufall(state.rundenGewichtet[stufe]), stufe };
  }
  state.hatGelegt = false;
  state.current = (state.current+1)%state.names.length;
  state.word=""; state.swapSel=[]; state.message=""; state.quiz=null;
  state.doubler=false; state.bonus=null; state.zielwort=null;
  state.wortWahl=[]; state.steckbrief=null; state.klangFuer=""; state.lob=""; state.bildFenster=null;
  state.phase="handoff"; render();
}

function listenStufe(norm){
  for (let k=3;k<=8;k++)
    if (state.rundenSets && state.rundenSets[k] && state.rundenSets[k].has(norm)) return k;
  return null;
}
function istRundenwort(norm){
  const stufe = state.zielwort ? state.zielwort.stufe : aktuelleStufe();
  return listenStufe(norm) === stufe;
}

function playWord(){
  if (state.aufgeloest) return;
  const norm = normalize(state.word);
  if (norm.length < 2) return;
  let nebenfund = null;
  if (state.modus==="runden"){
    const ls = listenStufe(norm);
    if (ls === null){
      // gar kein Listenwort: freundlich ablehnen, Auswahl leeren
      klangFalsch();
      state.wortWahl = [];
      state.word = "";
      state.message = ungueltigText();
      render();
      return;
    }
    if (ls !== state.zielwort.stufe) nebenfund = ls;
    state.message = "";
  }
  const hand = state.hands[state.current];
  let res = bestDecomposition(norm, hand);
  let gekauft = [], kosten = 0;
  if (!res){
    const k = bestDecompositionMitKauf(norm, hand, 3, state.scores[state.current]);
    if (!k) return;
    res = { symbols: k.symbols, score: k.score };
    gekauft = [...k.gekauft]; kosten = k.kosten;
  }
  // nur Handkarten aus der Hand entfernen, gekaufte nicht
  const kaufRest = [...gekauft];
  for (const s of res.symbols){
    const kIdx = kaufRest.indexOf(s);
    if (kIdx >= 0){ kaufRest.splice(kIdx,1); continue; }
    hand.splice(hand.indexOf(s),1);
  }
  let pts = res.score, teile=[];
  if (res.symbols.length>=8){ pts+=15; teile.push("+15 Langwort-Bonus"); }
  if (state.doubler){ pts*=2; teile.push("x2 Alltagschemie"); }
  if (kosten){ teile.push(`Zukauf ${gekauft.join(",")} = -${kosten}`); }
  state.scores[state.current] += pts - kosten;
  state.hatGelegt = true;
  state.lob = lobText();
  klangWort();
  const entryBase = `${state.names[state.current]}: ${res.symbols.join("")} = ${pts - kosten} Punkte${teile.length?" ("+teile.join(", ")+")":""} [${state.word.trim()}]`
    + (nebenfund ? ` (Nebenfund Stufe ${nebenfund} \u2013 gesucht war: ${state.zielwort.wort})` : "");
  // Zusatzfragen: pro (verschiedenem) Element im Wort eine Frage, je +1 Punkt
  const einzigartig = [...new Set(res.symbols)];
  state.bonus = { symbols: einzigartig, idx: 0, extra: 0,
    needed: HAND_SIZE - hand.length, entryBase };
  naechsteBonusFrage();
}

function naechsteBonusFrage(){
  const b = state.bonus;
  if (b.idx >= b.symbols.length){
    state.scores[state.current] += b.extra;
    const entry = b.entryBase + ` Zusatzfragen: ${b.extra}/${b.symbols.length} (+${b.extra})`;
    const needed = b.needed;
    state.bonus = null;
    if (state.scores[state.current] >= state.target){ nextPlayer(entry); return; }
    if (state.modus === "runden"){ nextPlayer(entry); return; }
    startDraw(needed, [], entry);
    return;
  }
  const sym = b.symbols[b.idx];
  state.quiz = { sym, frage: macheAlltagsZusatzfrage(sym), gewaehlt: null, art: "bonus" };
  state.phase = "quiz"; render();
}

function beginStartQuiz(){
  if (state.modus === "runden") waehleZielwort();
  state.quiz = { sym:null, frage:macheAlltagsfrage(), gewaehlt:null, art:"start" };
  state.phase = "quiz";
  render();
}

function swapTiles(){
  if (!state.swapSel.length){ state.message=kommentarOhneWiederholung("tauschLeer", ["Waehle zuerst 1–3 Kaertchen aus – Gedankenlesen ist noch nicht eingebaut.","Ohne ausgewaehlte Kaertchen kann selbst Mendelejew nichts tauschen.","Erst Kaertchen antippen, dann tauschen. Die Reihenfolge ist chemisch wichtig."]); render(); return; }
  const normS = normalize(state.word);
  const res = normS.length >= 2 ? bestDecomposition(normS, state.hands[state.current]) : null;
  const resK = (!res && normS.length >= 2)
    ? bestDecompositionMitKauf(normS, state.hands[state.current], 3, state.scores[state.current]) : null;
  if (res || resK){
    state.message=kommentarOhneWiederholung("tauschNein", ["Du kannst ein Wort legen – Tauschen waere jetzt ein bisschen geschummelt.","Da geht noch ein Wort! Die Tauschmaschine bleibt zu.","Erst das moegliche Wort legen, dann darf das Periodensystem wieder mischen."]);
    render(); return;
  }
  if (!confirm("Tauschen ist nur erlaubt, wenn du wirklich KEIN Wort legen kannst.\nDeine Mitspieler duerfen das anzweifeln. Trotzdem tauschen?")) return;
  const hand = state.hands[state.current];
  const back = [];
  for (const idx of [...state.swapSel].sort((a,b)=>b-a)) back.push(hand.splice(idx,1)[0]);
  startDraw(back.length, back, `${state.names[state.current]} tauscht ${back.length} Kaertchen (kein Wort moeglich).`);
}

// ---------------- Ziehung (lebende Lostrommel) ----------------
let bubbleTimer = null;

function startDraw(needed, swapBack, logEntry){
  if (needed<=0 || !state.drum.length){
    state.drum.unshift(...swapBack);
    nextPlayer(logEntry); return;
  }
  state.draw = { needed, maxPick: Math.min(needed, 8, state.drum.length),
    picked: [], swapBack, logEntry };
  state.phase = "draw"; render();
  if (typeof window !== "undefined") beginBubbles();
}

function beginBubbles(){
  stopBubbles();
  bubbleTimer = setInterval(spawnBubble, 450);
  spawnBubble(); spawnBubble();
}
function stopBubbles(){
  if (bubbleTimer){ clearInterval(bubbleTimer); bubbleTimer = null; }
}

function spawnBubble(){
  const arena = document.getElementById("arena");
  if (!arena || state.phase!=="draw" || !state.drum.length) return;
  if (arena.querySelectorAll(".bubble:not(.weg)").length >= 6) return;
  let sym = null;
  // Rundenmodus: mit 40% Wahrscheinlichkeit ein Symbol zeigen, das fuer
  // das naechste Rundenwort gebraucht wird (sofern in der Trommel)
  if (state.modus==="runden" && Math.random() < 0.4){
    const ziel = state.naechstesZiel[state.current];
    const noetig = minZerlegung(normalize(ziel.wort)) || [];
    const kandidaten = noetig.filter(s => state.drum.includes(s));
    if (kandidaten.length) sym = zufall(kandidaten);
  }
  if (!sym) sym = state.drum[Math.floor(Math.random()*state.drum.length)];
  const el = document.createElement("div");
  el.className = "bubble";
  el.innerHTML = tileHtml(sym, {});
  const b = arena.getBoundingClientRect();
  el.style.left = Math.random() * Math.max(10, b.width - 80) + "px";
  el.style.top  = Math.random() * Math.max(10, b.height - 92) + "px";
  el.onclick = () => grabSymbol(sym, el);
  arena.appendChild(el);
  setTimeout(() => {
    if (el.parentNode && !el.dataset.genommen){
      el.classList.add("weg");
      setTimeout(()=>el.remove(), 320);
    }
  }, 1500 + Math.random()*1300);
}

function grabSymbol(sym, el){
  const d = state.draw;
  if (!d || d.picked.length >= d.maxPick) return;
  const idx = state.drum.indexOf(sym);
  if (idx < 0) return;
  state.drum.splice(idx, 1);
  d.picked.push(sym);
  if (el){ el.dataset.genommen = "1"; el.remove(); }
  const anzeige = document.getElementById("pickstand");
  if (anzeige) anzeige.innerHTML =
    d.picked.map(s=>tileHtml(s,{small:true})).join("") +
    `<span class="hint" style="align-self:center;margin-left:8px">${d.picked.length} / ${d.maxPick}</span>`;
  if (d.picked.length >= d.maxPick) finishDraw();
}

function finishDraw(){
  if (!state.draw) return;
  stopBubbles();
  const d = state.draw;
  const hand = state.hands[state.current];
  hand.push(...d.picked);
  // Rest automatisch auffuellen (falls mehr als 5 gebraucht oder abgebrochen)
  let auto = 0;
  let nochNoetig = d.needed - d.picked.length;
  while (nochNoetig > 0 && state.drum.length){ hand.push(state.drum.pop()); nochNoetig--; auto++; }
  state.drum.unshift(...d.swapBack);
  const zusatz = auto ? ` (+${auto} automatisch)` : "";
  const entry = d.logEntry + (d.picked.length ? ` Gezogen: ${d.picked.join(", ")}${zusatz}` : zusatz);
  state.draw = null;
  nextPlayer(entry);
}

function quizAntwort(idx){
  if (state.quiz.gewaehlt !== null) return;
  state.quiz.gewaehlt = idx;
  const richtig = idx === state.quiz.frage.richtig;
  if (state.quiz.art === "bonus")
    state.quiz.feedback = bonusFeedback(state.quiz.sym, richtig);
  else if (state.quiz.art === "start")
    state.quiz.feedback = startFeedback(richtig);
  else if (state.quiz.art === "hinweis")
    state.quiz.feedback = hinweisFeedback(richtig, state.quiz.kosten);
  if (state.quiz.art === "hinweis") {
    if (richtig) klangTippGerettet(); else klangTippAbzug();
  } else {
    if (richtig) klangRichtig(); else klangFalsch();
  }
  render();
}

function stufeFuer(zugNr){
  return Math.min(3 + Math.floor(zugNr / state.names.length), 8);
}
function aktuelleStufe(){
  return stufeFuer(state.zugNr);
}

// eine Zerlegung mit minimal vielen Symbolen (fuer die Ziehungs-Hilfe)
function minZerlegung(w){
  const INF = 1e9, n = w.length;
  const dp = Array(n+1).fill(INF), her = Array(n+1).fill(null);
  dp[0] = 0;
  for (let i=0;i<n;i++){
    if (dp[i]===INF) continue;
    for (const L of [1,2]){
      const sym = i+L<=n ? BY_LOWER[w.slice(i,i+L)] : null;
      if (sym && dp[i]+1 < dp[i+L]){ dp[i+L]=dp[i]+1; her[i+L]=[i,sym]; }
    }
  }
  if (dp[n]===INF) return null;
  const syms = [];
  for (let i=n; i>0; i=her[i][0]) syms.unshift(her[i][1]);
  return syms;
}

function waehleZielwort(){
  // Rundenmodus: geheimes Wort waehlen und seine Symbole vollstaendig
  // in der Hand verstecken (Rest mit Zufallskaertchen auffuellen)
  const ziel = state.naechstesZiel[state.current];
  const hand = state.hands[state.current];
  // alte Hand zurueck in die Trommel
  state.drum.unshift(...hand.splice(0, hand.length));
  // Symbole des geheimen Worts einpflanzen (aus der Trommel nehmen, wo moeglich)
  const noetig = minZerlegung(normalize(ziel.wort)) || [];
  for (const s of noetig){
    const i = state.drum.indexOf(s);
    if (i >= 0) state.drum.splice(i, 1);
    hand.push(s);
  }
  while (hand.length < HAND_SIZE && state.drum.length) hand.push(state.drum.pop());
  // mischen, damit die gesuchten Symbole nicht vorn stehen
  for (let i=hand.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [hand[i],hand[j]]=[hand[j],hand[i]]; }
  state.zielwort = { wort: ziel.wort, stufe: ziel.stufe, legbar: true };
  state.word = "";
  state.wortWahl = [];
  state.hinweise = 0;
  state.aufgeloest = false;
}

function aufloesen(){
  // Wort direkt in der Eingabemaske zeigen; Zug endet erst mit "Weiter"
  state.word = state.zielwort.wort;
  state.aufgeloest = true;
  render();
}

function weiterNachAufloesen(){
  state.hatGelegt = true; // naechste Runde gibt es ein neues Wort
  nextPlayer(`${state.names[state.current]} loest auf \u2013 gesucht war: ${state.zielwort.wort} (0 Punkte)`);
}

// Tipp-Challenge: richtige Chemieantwort verhindert den Abzug.
// Bei falscher Antwort steigen die Kosten weiterhin: 2, 4, 6, 8 ... Punkte.
function naechsteHinweisKosten(){
  return (state.hinweise + 1) * 2;
}
function hinweisGeben(){
  if (state.hinweise >= state.zielwort.wort.length) return;
  const hinweisNr = state.hinweise + 1;
  const kosten = naechsteHinweisKosten();
  if (state.scores[state.current] < kosten){
    state.message = `Fuer diese Tipp-Challenge brauchst du mindestens ${kosten} Punkte als Einsatz. Dein Konto hat gerade ${state.scores[state.current]}.`;
    render(); return;
  }
  state.message = "";
  state.quiz = {
    sym:null, frage:macheHinweisfrage(hinweisNr), gewaehlt:null,
    art:"hinweis", kosten, hinweisNr
  };
  state.phase = "quiz";
  klangTippStart();
  render();
}

function quizWeiter(){
  const { frage, gewaehlt, art } = state.quiz;
  const richtig = gewaehlt === frage.richtig;
  if (art === "start"){
    state.doubler = richtig;
    state.quiz = null;
    state.phase = "turn"; render();
  } else if (art === "hinweis") {
    const kosten = state.quiz.kosten;
    if (!richtig) state.scores[state.current] -= kosten;
    state.hinweise++;
    state.message = richtig
      ? `Tipp ${state.hinweise} freigeschaltet – kein Punktabzug.`
      : `Tipp ${state.hinweise} freigeschaltet – ${kosten} Punkte abgezogen.`;
    state.quiz = null;
    state.phase = "turn";
    render();
  } else { // bonus
    if (richtig) state.bonus.extra++;
    state.bonus.idx++;
    state.quiz = null;
    naechsteBonusFrage();
  }
}

// ---------------- Darstellung ----------------
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function tileHtml(sym, opts={}){
  const [,name,num,val] = BY_SYMBOL[sym];
  const cls = "tile" + (opts.small?" small":"") + (opts.big?" big":"")
    + (opts.selected?" selected":"") + (opts.onclick?" clickable":"") + (opts.kauf?" kauf":"");
  const click = opts.onclick ? ` onclick="${opts.onclick}"` : "";
  const zeigName = opts.verdeckt ? "???" : name;
  const badge = opts.ordnung ? `<div style="position:absolute;top:-7px;right:-7px;width:18px;height:18px;
    border-radius:50%;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center">${opts.ordnung}</div>` : "";
  return `<div class="${cls}" style="border-top:5px solid ${tierColor(val)};position:relative"${click}>${badge}
    <div class="top"><span>${opts.verdeckt||opts.zahlVerdeckt?"?":num}</span><span style="font-weight:700;color:${tierColor(val)}">${val}P</span></div>
    <div class="sym">${sym}</div>
    ${opts.small ? "" : `<div class="name">${zeigName}</div>`}
  </div>`;
}

function scorebarHtml(){
  const pillen = state.scores.map((s,i)=>{
    const anteil = Math.max(0, Math.min(100, Math.round(100*s/state.target)));
    const aktiv = i===state.current;
    return `<span style="display:inline-block;margin:2px 6px 2px 0;padding:3px 10px 5px;
      border-radius:999px;border:1.5px solid ${aktiv?"var(--ink)":"var(--line)"};
      background:var(--card);${aktiv?"box-shadow:0 2px 6px rgba(30,58,76,.18);":""}">
      ${chip(state.avatare[i])}${aktiv?"<b>":""}${esc(state.names[i])}: ${s}${aktiv?"</b>":""}
      <span style="display:block;height:4px;border-radius:2px;background:var(--grid);margin-top:3px">
        <span style="display:block;height:4px;border-radius:2px;width:${anteil}%;
          background:${CHEMIKER[state.avatare[i]].farbe}"></span></span></span>`;
  }).join("");
  return pillen
    + (state.modus==="runden"?`<span style="margin-left:8px;color:var(--grey)">Stufe: ${aktuelleStufe()}</span>`:"")
    + `<span style="margin-left:8px;color:var(--grey)">Trommel: ${state.drum.length}</span>`;
}

function logHtml(){
  if (!state.log.length) return "";
  return `<div class="card log"><div style="font-weight:700;margin-bottom:6px">Spielverlauf</div>` +
    state.log.map(l=>`<div>${esc(l)}</div>`).join("") + `</div>`;
}

function steckbriefHtml(){
  if (!state.steckbrief) return bildFensterHtml();
  const sym = state.steckbrief;
  const [,name,z,val,kat] = BY_SYMBOL[sym];
  const kuenstlich = SYNTHESE[sym];
  return `<div class="modal-hintergrund" onclick="if(event.target===this){state.steckbrief=null;render();}">
    <div class="modal">
      <div class="kopf">
        <div><span style="font-family:ui-monospace,monospace;font-weight:800;font-size:22px">${sym}</span>
          <b style="margin-left:8px">${esc(name)}</b>
          <span style="color:var(--grey);margin-left:8px">Ordnungszahl ${z} \u00b7 ${esc(KAT_NAMEN[kat])}</span></div>
        <button class="zu" onclick="state.steckbrief=null;render()">\u00d7</button>
      </div>
      <div style="text-align:center;margin:6px 0">
        ${kuenstlich ? zeichneSynthese(sym) : zeichneAtom(sym)}
      </div>
      ${kuenstlich ? `<div class="hint" style="text-align:center;margin-bottom:8px">
        Kuenstlich erzeugt: ${esc(kuenstlich[2])}</div>`
      : `<div class="hint" style="text-align:center;margin-bottom:8px">
        Atommodell: ${z} Protonen im Kern, Elektronen auf ${schalenBelegung(sym).length} Schalen
        (${schalenBelegung(sym).join(", ")})</div>`}
      <div style="font-size:14px;line-height:1.5;padding:8px;border:1.5px dashed var(--line);border-radius:8px">
        &#128161; ${esc(INFO[sym])}</div>
      ${z<=103 ? `<div class="hint" style="margin-top:6px">Elektronenkonfiguration:
        <span style="font-family:ui-monospace,monospace">${konfigText(z, sym)}</span></div>`:""}
      ${VERBINDUNG[sym] ? `<div class="hint">Wichtige Verbindung:
        <span style="font-family:ui-monospace,monospace">${formel(VERBINDUNG[sym][1])}</span>
        (mit ${esc(VERBINDUNG[sym][0])})${VERBINDUNG_NAME[sym]?` \u2013 ${esc(VERBINDUNG_NAME[sym])}`:""}</div>`:""}
      ${DICHTE[sym]!==undefined?`<div class="hint" style="margin-top:6px">Dichte: ${String(DICHTE[sym]).replace(".",",")} g/cm\u00b3</div>`:""}

      <div class="row" style="margin-top:10px">
        <button style="flex:2" onclick="ladeBild('${sym}')">&#128247; Foto anzeigen (Wikipedia)</button>
        <button style="flex:1" onclick="window.open('https://de.wikipedia.org/wiki/'+encodeURIComponent('${esc(name)}'))">Artikel \u2197</button>
      </div>

  </div>` + bildFensterHtml();
}

// ---------------- Zweites Fenster: Elementfoto von Wikipedia ----------------
const WIKI_API = "https://de.wikipedia.org/w/api.php?action=query&format=json&origin=*";
const WIKI_PARSE = "https://de.wikipedia.org/w/api.php?action=parse&format=json&origin=*&prop=text&formatversion=2&page=Bildtafel_der_chemischen_Elemente";
// unbrauchbare Dateien (Icons, Logos, Diagramme) aussortieren
const BILD_MUELL = /(logo|icon|nuvola|disambig|qsicon|loudspeaker|sound|wiktionary|commons-|electron.?shell|oxidation|spektrum|spectrum|flagge?|wappen|karte|map|diagramm?|graph|chart|animation|\.svg$|\.gif$|\.ogg$|\.ogv$|\.webm$)/i;

// Bildtafel der chemischen Elemente: eine Wikipedia-Seite mit je einem
// Foto pro Element -> einmal laden, dann alle Fotos sofort verfuegbar
let BILDTAFEL = null; // { Elementname: {gross, klein} }

function parseBildtafel(html){
  const tafel = {};
  for (const kasten of html.split(/gallerybox|<li\b/).slice(1)){
    // Bildquelle: src oder srcset
    let quelle = kasten.match(/src="(\/\/upload\.wikimedia\.org[^"]+)"/);
    if (!quelle){
      const ss = kasten.match(/srcset="(\/\/upload\.wikimedia\.org[^"\s]+)/);
      if (ss) quelle = ss;
    }
    if (!quelle) continue;
    const klein = "https:" + quelle[1];
    const gross = klein.replace(/\/(\d+)px-/, "/480px-");
    // Elementname: ueber Artikel-Links (href oder title)
    const namen = new Set();
    for (const m of kasten.matchAll(/href="\/wiki\/([^"#?]+)"/g)){
      try { namen.add(decodeURIComponent(m[1]).replace(/_/g," ")); } catch(e){}
    }
    for (const m of kasten.matchAll(/title="([^"]+)"/g)) namen.add(m[1]);
    for (const name of namen){
      if (BY_NAME[name] && !tafel[name]) tafel[name] = { gross, klein };
    }
  }
  return tafel;
}

function wikiFetch(url){
  return fetch(url).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

function ladeBild(sym){
  const name = BY_SYMBOL[sym][1];
  const seite = "https://de.wikipedia.org/wiki/" + encodeURIComponent(name);
  // 1. Lokale Bilddatei (elementbilder.js neben der Spieldatei)? -> sofort, offline
  if (typeof ELEMENT_BILDER !== "undefined" && ELEMENT_BILDER[sym]){
    state.bildFenster = { sym, status:"ok", url: ELEMENT_BILDER[sym], seite,
      quelle:"lokale Bilddatei (Original: Wikipedia)" };
    render(); return;
  }
  state.bildFenster = { sym, status: "laedt" };
  render();
  const fertig = (ergebnis) => {
    if (!state.bildFenster || state.bildFenster.sym !== sym) return;
    state.bildFenster = ergebnis; render();
  };
  const ausTafel = () => {
    if (BILDTAFEL[name]){
      fertig({ sym, status:"ok", url: BILDTAFEL[name].gross, urlKlein: BILDTAFEL[name].klein,
        seite, quelle:"Bildtafel der chemischen Elemente" });
    } else {
      fertig({ sym, status:"fehler", grund: SYNTHESE[sym]
        ? "Von diesem kuenstlichen Element existiert kein Foto \u2013 es zerfaellt zu schnell, es entstehen nur einzelne Atome."
        : "In der Bildtafel der Elemente ist kein Foto hinterlegt." });
    }
  };
  if (BILDTAFEL){ ausTafel(); return; }
  wikiFetch(WIKI_PARSE)
    .then(daten => {
      const html = daten.parse && daten.parse.text ? daten.parse.text : "";
      const tafel = parseBildtafel(html);
      if (!Object.keys(tafel).length) throw new Error("Bildtafel konnte nicht gelesen werden");
      BILDTAFEL = tafel;
      ausTafel();
    })
    .catch(err => fertig({ sym, status:"fehler", grund: String((err && err.message) || err) }));
}

function bildFensterHtml(){
  const b = state.bildFenster;
  if (!b) return "";
  const name = BY_SYMBOL[b.sym][1];
  let inhalt = "";
  if (b.status === "laedt")
    inhalt = `<div class="hint" style="padding:30px;text-align:center">Foto wird von Wikipedia geladen \u2026</div>`;
  else if (b.status === "ok")
    inhalt = `<img src="${b.url}" alt="${esc(name)}" style="width:100%;border-radius:8px"
      ${b.urlKlein?`onerror="this.onerror=null;this.src='${b.urlKlein}'"`:""}>
      <div class="hint" style="margin-top:6px;text-align:center">Bildquelle: ${b.quelle?esc(b.quelle)+", ":""}Wikipedia (frei lizenziert; Details beim
      ${b.seite?`<a href="${b.seite}" target="_blank">Artikel</a>`:"Artikel"})</div>`;
  else
    inhalt = `<div class="err" style="padding:20px;text-align:center">Foto konnte nicht geladen werden.
      ${b.grund?`<br><span class="hint">Grund: ${esc(b.grund)}</span>`:""}
      <br><span class="hint">Alternativ den Artikel-Knopf nutzen \u2013 dort ist das Foto zu sehen.</span></div>`;
  return `<div class="modal-hintergrund" style="z-index:60" onclick="if(event.target===this){state.bildFenster=null;render();}">
    <div class="modal" style="max-width:380px">
      <div class="kopf">
        <b>${esc(name)} \u2013 Foto</b>
        <button class="zu" onclick="state.bildFenster=null;render()">\u00d7</button>
      </div>
      ${inhalt}
    </div>
  </div>`;
}

  // ---- Spielzug ----

      : `<div class="err">Laesst sich nicht legen \u2013 auch nicht mit bis zu 3 zugekauften Elementen.</div>`;
  }
  if (res){
    const bonus = res.symbols.length>=8;
    resultHtml = `
      <div class="tiles" style="margin-bottom:8px">${res.symbols.map(s=>tileHtml(s,{small:true})).join("")}</div>
      <div style="font-size:15px"><b>${res.symbols.join("")}</b> — ${res.score} Punkte
      ${bonus?'<span style="color:var(--good)"> +15 Bonus (8+ Symbole)</span>':""}</div>`;
  }
  if (resKauf){
    const kaufRest = [...resKauf.gekauft];
    const kacheln = resKauf.symbols.map(s=>{
      const i = kaufRest.indexOf(s);
      if (i>=0){ kaufRest.splice(i,1); return tileHtml(s,{small:true, kauf:true}); }
      return tileHtml(s,{small:true});
    }).join("");
    const bonus = resKauf.symbols.length>=8;
    resultHtml = `
      <div class="tiles" style="margin-bottom:8px">${kacheln}</div>
      <div style="font-size:15px"><b>${resKauf.symbols.join("")}</b> — ${resKauf.score} Punkte
      ${bonus?'<span style="color:var(--good)"> +15 Bonus (8+ Symbole)</span>':""}<br>
      <span style="color:var(--bad)">Zukauf noetig: ${resKauf.gekauft.join(", ")} = \u2212${resKauf.kosten} Punkte</span>
      <span class="hint"> (gestrichelte Kaertchen, max. 3, wird vom Konto abgezogen)</span></div>`;
  }
  const aktiv = res || resKauf;
  if (aktiv && norm !== state.klangFuer){ klangGefunden(); state.klangFuer = norm; }
  const basis = aktiv ? (aktiv.score + (aktiv.symbols.length>=8?15:0)) * (state.doubler?2:1) : 0;
  const total = aktiv ? basis - (resKauf ? resKauf.kosten : 0) : 0;

  app.innerHTML = `
  <div class="card row game-header" style="justify-content:space-between;align-items:center;flex-wrap:wrap">
    <h1 style="font-size:20px">WORTSTOFF</h1>
    <div class="scorebar">${scorebarHtml()}</div>
  </div>
  <div class="card hand-card">
    <div style="font-weight:700;margin-bottom:8px">${esc(state.names[state.current])}, deine Kaertchen (${hand.length}):
      ${state.doubler?'<span style="color:var(--good);margin-left:8px">&#10024; Verdoppler aktiv!</span>':""}</div>
    <div class="tiles">${hand.map((s,i)=>{
      const gewaehlt = state.modus==="runden" ? state.wortWahl.includes(i) : state.swapSel.includes(i);
      const ordnung = state.modus==="runden" && gewaehlt ? state.wortWahl.indexOf(i)+1 : null;
      return tileHtml(s,{selected:gewaehlt, ordnung, onclick:`toggleSwap(${i})`});
    }).join("")}</div>
    <div class="hint">${state.modus==="runden"
      ? "Das geheime Rundenwort steckt vollstaendig in diesen Kaertchen \u2013 tippe die Symbole in der richtigen Reihenfolge an! Nochmal antippen entfernt ein Symbol."
      : "Lege ein Wort. Nur wenn wirklich keins moeglich ist, darfst du bis zu 3 Kaertchen antippen und tauschen."}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">${chip(state.avatare[state.current])} ${state.modus==="runden"?`Rundenwort finden (Stufe ${state.zielwort.stufe})`:"Wort legen"}</div>
    ${state.modus==="runden" ? `
      <div class="hint" style="margin-bottom:8px">In deinen Kaertchen steckt ein geheimes Wort aus
        <b>${state.zielwort.stufe} Elementsymbolen</b> \u2013 vollstaendig! Finde und tippe es.</div>
      ${state.hinweise>0 && !state.aufgeloest ? `<div style="text-align:center;font-family:ui-monospace,monospace;
        font-size:20px;letter-spacing:4px;margin-bottom:8px">${esc(state.zielwort.wort.slice(0,state.hinweise))}${"\u2022".repeat(Math.max(0,state.zielwort.wort.length-state.hinweise))}</div>` : ""}
      ${state.aufgeloest ? `<div style="text-align:center;color:var(--bad);font-weight:700;margin-bottom:6px">Aufgeloest \u2013 das gesuchte Wort war:</div>` : ""}
    ` : ""}
    <input type="text" id="wordinput" ${state.aufgeloest||state.modus==="runden"?"readonly":""}
      placeholder="${state.modus==="runden"?"Symbole antippen \u2026":"Wort eintippen \u2026 z.B. Scheibenwischer"}"
      style="font-size:20px;text-align:center;letter-spacing:1px" value="${esc(state.word)}"
      oninput="state.word=this.value;renderKeepFocus()">
    ${state.modus==="runden" && !state.aufgeloest ? `
      <div class="row" style="margin-top:6px">
        <button style="flex:1;padding:6px" onclick="wahlZurueck()">\u232b Letztes entfernen</button>
        <button style="flex:1;padding:6px" onclick="wahlLeeren()">Leeren</button>
      </div>` : ""}
    <div style="min-height:90px;margin-top:10px">${resultHtml}${nebenfundHinweis}</div>
    ${state.message?`<div class="message-box">💬 ${esc(state.message)}</div>`:""}
    <div class="row" style="flex-wrap:wrap">
      ${state.aufgeloest ? `
        <button class="primary" style="flex:1" onclick="weiterNachAufloesen()">Weiter (0 Punkte)</button>
      ` : `
        <button class="primary" style="flex:2;min-width:150px" ${aktiv?"":"disabled"} onclick="playWord()">
          ⚗️ Wort legen${aktiv?` (${total>=0?"+":""}${total})`:""}</button>
        ${state.modus==="runden"
          ? `<button class="hint-button" style="flex:1;min-width:165px" onclick="hinweisGeben()">🧠 Tipp-Challenge<br><span style="font-size:11px;font-weight:600">richtig: gratis · falsch: −${naechsteHinweisKosten()} P.</span></button>
             <button style="flex:1;min-width:110px" onclick="aufloesen()">Aufloesen</button>`
          : `<button style="flex:1;min-width:110px" ${aktiv?"disabled":""} onclick="swapTiles()">Tauschen (${state.swapSel.length})</button>`}
      `}
    </div>
  </div>` + logHtml() + steckbriefHtml();
}

function toggleSwap(i){
  if (state.modus === "runden"){ waehleSymbol(i); return; }
  const sel = state.swapSel;
  const pos = sel.indexOf(i);
  if (pos>=0) sel.splice(pos,1);
  else if (sel.length<3) sel.push(i);
  render();
}

// Rundenmodus: Wort durch Antippen der Kaertchen zusammensetzen
function waehleSymbol(i){
  if (state.aufgeloest) return;
  const pos = state.wortWahl.indexOf(i);
  if (pos >= 0) state.wortWahl.splice(pos, 1);   // nochmal antippen = entfernen
  else state.wortWahl.push(i);
  const hand = state.hands[state.current];
  state.word = state.wortWahl.map(idx => hand[idx]).join("");
  render();
}

function wahlLeeren(){
  state.wortWahl = [];
  state.word = "";
  render();
}

function wahlZurueck(){
  state.wortWahl.pop();
  const hand = state.hands[state.current];
  state.word = state.wortWahl.map(idx => hand[idx]).join("");
  render();
}

function renderKeepFocus(){
  const el = document.getElementById("wordinput");
  const pos = el ? el.selectionStart : 0;
  render();
  const neu = document.getElementById("wordinput");
  if (neu){ neu.focus(); neu.setSelectionRange(pos,pos); }
}

render();
</script>
</body>
</html>
